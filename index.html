<h1 id="%E4%BA%8B%E5%89%8D%E6%BA%96%E5%82%99">事前準備</h1>
<ul>
<li>註冊 <a href="http://github.com">GitHub</a> 帳號</li>
<li>確認已安裝 Git
<ul>
<li>在 Terminal 輸入 <code>git</code> 確認</li>
<li><code>sudo apt install git</code></li>
<li><code>sudo dnf install git</code></li>
</ul>
</li>
<li>選擇編輯器 (vim, emacs, gedit)</li>
</ul>
</section>

<h1 id="%E7%92%B0%E5%A2%83%E8%A8%AD%E5%AE%9A">環境設定</h1>
<p><code>git config --global user.email &quot;you@example.com&quot;</code></p>
<p><code>git config --global user.name &quot;Your Name&quot;</code></p>
<p><code>git config --global color.ui true</code></p>
<p><code>git config --global core.editor vim</code></p>
</section>

<h1 id="show-branch-names-in-ps1">Show branch names in $PS1</h1>
<p><a href="http://xta.github.io/HalloweenBash/" target="_blank">Halloween Bash Profile Generator</a></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>function parse_git_branch {
    git branch --no-color 2&gt; /dev/null | sed -e '/^[^*]/d' -e 's/* \(.*\)/(\1)/'
}
</code></pre>
<p><code>export PS1=&quot;\h:\W \u\$(parse_git_branch)$ &quot;</code></p>
